<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - PC Forge</title>
    <link rel="stylesheet" href="../style/index.css">
    <style>
        .cart-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        
        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            margin-right: 15px;
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .item-price {
            color: #b91c1c;
            font-size: 18px;
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .quantity-btn {
            background: #b91c1c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .quantity {
            margin: 0 10px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            width: 50px;
            text-align: center;
        }
        
        .remove-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .cart-summary {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .checkout-btn {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .empty-cart {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .continue-shopping {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="../img/logo.png" alt="PC Forge Logo" />
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="product.html">Products</a>
            <a href="pages/orders.html">Orders</a>
            <button class="cart-btn">
                Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>

    <div class="cart-container">
        <h2>Shopping Cart</h2>
        
        <div id="cart-items">
            <!-- Cart items will be loaded here -->
        </div>
        
        <div class="cart-summary">
            <h3>Order Summary</h3>
            <p>Subtotal: ₱<span id="subtotal">0</span></p>
            <p>Shipping: ₱<span id="shipping">150</span></p>
            <hr>
            <p><strong>Total: ₱<span id="total">0</span></strong></p>
            
            <button class="checkout-btn" onclick="proceedToCheckout()">
                Proceed to Checkout
            </button>
            
            <button class="continue-shopping" onclick="location.href='product.html'">
                Continue Shopping
            </button>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 PC Forge. All rights reserved.</p>
            <div class="social-links">
                <a href="https://www.facebook.com/profile.php?id=61584086232232" aria-label="Facebook">Facebook</a>
            </div>
        </div>
    </footer>

    <script>

            // Power Supplies
            'corsairrm850x': {

            },
            'seasonicfocusgx650': {
                name: 'Seasonic Focus GX-650',
                price: 6200,
                image: 'https://dynaquestpc.com/cdn/shop/products/GX-650.jpg?v=1587228540&width=1024',
            }
        };

        // Load cart from localStorage
        function getCart() {
            const cart = localStorage.getItem('pcforge-cart');
            return cart ? JSON.parse(cart) : {};
        }

        // Save cart to localStorage
        function saveCart(cart) {
            localStorage.setItem('pcforge-cart', JSON.stringify(cart));
        }

        // Update cart count in navigation
        function updateCartCount() {
            const cartCountElement = document.getElementById('cart-count');
            if (cartCountElement) {
                const cart = getCart();
                let totalItems = 0;
                for (let productId in cart) {
                    totalItems += cart[productId];
                }
                cartCountElement.textContent = totalItems;
            }
        }

        // Display cart items
        function displayCart() {
            const cart = getCart();
            const cartItemsDiv = document.getElementById('cart-items');
            
            if (Object.keys(cart).length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-cart"><h3>Your cart is empty</h3><p>Add some products to get started!</p></div>';
                updateSummary();
                return;
            }

            let cartHTML = '';
            for (let productId in cart) {
                const product = products[productId];
                const quantity = cart[productId];
                
                cartHTML += `
                    <div class="cart-item">
                        <img src="${product.image}" alt="${product.name}" class="item-image">
                        <div class="item-details">
                            <div class="item-name">${product.name}</div>
                            <div class="item-price">₱${product.price.toLocaleString()}</div>
                            <div class="quantity-controls">
                                <button class="quantity-btn" onclick="updateQuantity('${productId}', -1)">-</button>
                                <input type="number" class="quantity" value="${quantity}" readonly>
                                <button class="quantity-btn" onclick="updateQuantity('${productId}', 1)">+</button>
                                <button class="remove-btn" onclick="removeItem('${productId}')">Remove</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            cartItemsDiv.innerHTML = cartHTML;
            updateSummary();
        }

        // Update item quantity
        function updateQuantity(productId, change) {
            const cart = getCart();
            cart[productId] = (cart[productId] || 0) + change;
            
            if (cart[productId] <= 0) {
                delete cart[productId];
            }
            
            saveCart(cart);
            displayCart();
            updateCartCount();
        }

        // Remove item from cart
        function removeItem(productId) {
            const cart = getCart();
            delete cart[productId];
            saveCart(cart);
            displayCart();
            updateCartCount();
        }

        // Update order summary
        function updateSummary() {
            const cart = getCart();
            let subtotal = 0;
            
            for (let productId in cart) {
                const product = products[productId];
                subtotal += product.price * cart[productId];
            }
            
            const shipping = subtotal > 0 ? 150 : 0;
            const total = subtotal + shipping;
            
            document.getElementById('subtotal').textContent = subtotal.toLocaleString();
            document.getElementById('shipping').textContent = shipping.toLocaleString();
            document.getElementById('total').textContent = total.toLocaleString();
        }

        // Proceed to checkout
        function proceedToCheckout() {
            const cart = getCart();
            if (Object.keys(cart).length === 0) {
                alert('Your cart is empty!');
                return;
            }
            location.href = 'checkout.html';
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            displayCart();
        });
    </script>
</body>
</html>
